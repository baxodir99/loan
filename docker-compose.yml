version: "3.9"

services:
  web:
    build:
      context: .
      command: Dockerfile
    imaage: bahodir23/loanbook:latest
    container_name: loanbook
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8010"
    .env_file:
      - .env
    ports:
      - "8010:8010"
    volumes:
      - .:/app
      - ./static:/app/static
      - ./media:/app/media
    depends_on: []
    restart: always